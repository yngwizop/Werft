# Pull-only stack (pre-built images from GHCR).
# Dev/build: use docker-compose.yml instead.
#
#   cp .env.example .env   # TLS_CN + OTOBO_SSH_KEY
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Tag pin: WERFT_IMAGE_TAG=1.0.0  (default: latest)

name: werft

x-app-env: &app-env
  image: ghcr.io/yngwizop/werft:${WERFT_IMAGE_TAG:-latest}
  environment:
    DATABASE_URL: postgresql+psycopg://middleware:middleware@postgres:5432/middleware
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    WERFT_MASTER_KEY_PATH: /var/lib/werft/master.key
    WERFT_ENV_IMPORT: /app/.env.import
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  api:
    <<: *app-env
    user: "0:0"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - werft_master:/var/lib/werft
      - ./.env:/app/.env.import:ro
      - ${OTOBO_SSH_KEY:-/root/.ssh/id_ed25519}:${OTOBO_SSH_KEY:-/root/.ssh/id_ed25519}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    <<: *app-env
    user: "0:0"
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    volumes:
      - werft_master:/var/lib/werft
      - ./.env:/app/.env.import:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: ghcr.io/yngwizop/werft-nginx:${WERFT_IMAGE_TAG:-latest}
    environment:
      TLS_CN: ${TLS_CN:-werft}
    ports:
      - "80:80"
      - "443:443"
      - "8000:80"
    volumes:
      - nginx_tls:/etc/nginx/tls
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: middleware
      POSTGRES_PASSWORD: middleware
      POSTGRES_DB: middleware
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middleware -d middleware"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  catalog-sync:
    <<: *app-env
    user: "0:0"
    command: ["python", "scripts/catalog_sync_loop.py"]
    volumes:
      - werft_master:/var/lib/werft
      - ./.env:/app/.env.import:ro
      - ${OTOBO_SSH_KEY:-/root/.ssh/id_ed25519}:${OTOBO_SSH_KEY:-/root/.ssh/id_ed25519}:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  nginx_tls:
  werft_master:
